name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The pages are generated, not committed; check.mjs fails the run on a dead link, a missing or duplicate
      # title or description, or a leftover {app}.
      - run: node tools/build.mjs
      - run: node tools/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    uses: kallistesoft/kallistesoft-site/.github/workflows/deploy-ftp.yml@main
    with:
      folder: guides.kallistesoft.ca
    secrets: inherit
